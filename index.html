<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barcode Scanner Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <style>
        /* Custom base styles if needed, or Tailwind will handle most */
        body {
            font-family: sans-serif;
        }
        #interactive.viewport {
            position: relative;
            width: 100%;
            height: auto; /* Adjusted for responsiveness */
            min-height: 300px; /* Ensure a minimum height */
        }
        #interactive.viewport > canvas, #interactive.viewport > video {
            max-width: 100%;
            width: 100%;
            height: auto; /* Ensure video/canvas scales correctly */
        }
        canvas.drawing, canvas.drawingBuffer {
            position: absolute;
            left: 0;
            top: 0;
        }
        /* Tailwind will handle debug log overlay styling */
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4 max-w-3xl">
        <h1 class="text-2xl font-bold text-center mb-4">Barcode Scanner</h1>
        <div id="interactive" class="viewport rounded-lg shadow-lg overflow-hidden bg-black"></div>
        <div class="mt-6 flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-4">
            <button id="switch-camera" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-150 ease-in-out">
                Switch Camera
            </button>
            <button id="toggle-debug-log" class="w-full sm:w-auto bg-gray-600 hover:bg-gray-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-150 ease-in-out">Toggle Debug Log</button>
        </div>
    </div>

    <div id="debug-log-overlay" class="fixed inset-0 bg-black bg-opacity-75 z-40 hidden items-center justify-center p-4">
        <div id="debug-log" class="bg-white rounded-lg p-6 shadow-xl w-full max-w-lg max-h-[80vh] overflow-y-auto">
            <h3 class="text-xl font-semibold mb-3">Debug Log:</h3>
            <pre id="log-content" class="text-sm bg-gray-50 p-3 rounded"></pre>
        </div>
    </div>
    <script>
        function debugLog(message) {
            var logContent = $('#log-content');
            logContent.append(new Date().toISOString() + ': ' + message + '\n');
            logContent.scrollTop(logContent[0].scrollHeight);
        }

        $(function() {
            // Toggle debug log visibility
            $('#toggle-debug-log').on('click', function() {
                $('#debug-log-overlay').toggle();
            });

            // Close debug log when clicking outside
            $('#debug-log-overlay').on('click', function(e) {
                if (e.target === this) {
                    $(this).hide();
                }
            });

            var App = {
                init: function() {
                    debugLog('Initializing Quagga...');
                    Quagga.init(this.state, function(err) {
                        if (err) {
                            debugLog('Quagga initialization error: ' + err);
                            return;
                        }
                        debugLog('Quagga initialized successfully');
                        App.attachListeners();
                        Quagga.start();
                    });
                },
                restart: function() {
                    debugLog('Restarting Quagga with new settings...');
                    Quagga.stop();
                    // A short delay might be needed for Quagga to fully stop before re-init
                    setTimeout(() => {
                        Quagga.init(this.state, function(err) {
                            if (err) {
                                debugLog('Quagga re-initialization error: ' + err);
                                return;
                            }
                            debugLog('Quagga re-initialized successfully');
                            Quagga.start();
                        });
                    }, 100); // 100ms delay
                },
                attachListeners: function() {
                    var self = this;

                    // Existing listeners (if any, like .controls)
                    // $(".controls").on("click", "button.stop", ...);
                    // $(".controls").on("click", "button.start", ...);

                    $('#switch-camera').on('click', function() {
                        debugLog('Switch camera button clicked');
                        var currentFacingMode = self.state.inputStream.constraints.facingMode;
                        if (currentFacingMode === "environment") {
                            self.state.inputStream.constraints.facingMode = "user";
                            debugLog('Switching to user (front) camera');
                        } else {
                            self.state.inputStream.constraints.facingMode = "environment";
                            debugLog('Switching to environment (rear) camera');
                        }
                        self.restart();
                    });
                },
                state: {
                    inputStream: {
                        type : "LiveStream",
                        constraints: {
                            width: {min: 640},
                            height: {min: 480},
                            facingMode: "environment",
                            aspectRatio: {min: 1, max: 2}
                        }
                    },
                    locator: {
                        patchSize: "medium",
                        halfSample: true
                    },
                    numOfWorkers: 2,
                    frequency: 10,
                    decoder: {
                        readers : [
                            {format: "code_128_reader", config: {}},
                            {format: "ean_reader", config: {}},
                            {format: "ean_8_reader", config: {}},
                            {format: "code_39_reader", config: {}},
                            {format: "code_39_vin_reader", config: {}},
                            {format: "codabar_reader", config: {}},
                            {format: "upc_reader", config: {}},
                            {format: "upc_e_reader", config: {}},
                            {format: "i2of5_reader", config: {}},
                            {format: "2of5_reader", config: {}},
                            {format: "code_93_reader", config: {}}
                        ]
                    },
                    locate: true
                },
                lastResult : null
            };

            App.init();

            Quagga.onProcessed(function(result) {
                var drawingCtx = Quagga.canvas.ctx.overlay,
                    drawingCanvas = Quagga.canvas.dom.overlay;

                if (result) {
                    if (result.boxes) {
                        drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
                        result.boxes.filter(function (box) {
                            return box !== result.box;
                        }).forEach(function (box) {
                            Quagga.ImageDebug.drawPath(box, {x: 0, y: 1}, drawingCtx, {color: "green", lineWidth: 2});
                        });
                    }

                    if (result.box) {
                        Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "#00F", lineWidth: 2});
                    }

                    if (result.codeResult && result.codeResult.code) {
                        Quagga.ImageDebug.drawPath(result.line, {x: 'x', y: 'y'}, drawingCtx, {color: 'red', lineWidth: 3});
                    }
                }
            });

            Quagga.onDetected(function(result) {
                var code = result.codeResult.code;
                var format = result.codeResult.format;
                debugLog('Barcode detected: ' + code + ' (Type: ' + format + ')');

                if (App.lastResult !== code) {
                    App.lastResult = code;

                    // Send the code to the server via WebSocket
                    if (window.websocket && window.websocket.readyState === WebSocket.OPEN) {
                        var message = JSON.stringify({code: code, format: format});
                        window.websocket.send(message);
                        debugLog('Sent to server: ' + message);
                    } else {
                        debugLog('WebSocket not open, could not send: ' + code);
                    }
                }
            });
        });

        // WebSocket connection
        window.websocket = new WebSocket('wss://' + window.location.host);
        window.websocket.onopen = function() {
            debugLog('Connected to WebSocket server');
        };
        window.websocket.onerror = function(error) {
            debugLog('WebSocket Error: ' + error);
        };
        window.websocket.onclose = function(event) {
            debugLog('WebSocket connection closed: ' + event.reason);
        };
    </script>
</body>
</html>
